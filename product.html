<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | EmanStore</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="./css/theme.css">
</head>

<body>
    <header>
        <div class="top-header">
            <a class="logo" href="index.html" aria-label="EmanStore home">
                <i class="fa-solid fa-person-half-dress"></i>
                <h1>EmanStore</h1>
            </a>
            <div class="top-header-links">
                <a href="login.html">Sign in</a>
                <a href="register.html">Create account</a>
            </div> <!--top-header-links -->
            <ul id="user">
                <li><a href="#" id="user_info"></a></li>
            </ul>
        </div> <!-- top-header -->
    </header>
    <!--  -->
    <div class="middle-header">
        <div class="search">
            <input type="search" placeholder="Search the collection" aria-label="Search products">
            <button type="button">Search</button>
        </div> <!-- search -->
        <button class="cart" type="button" aria-expanded="false" aria-label="Open shopping bag">
            <i class="fa-solid fa-cart-shopping"></i>
            <span>0</span>
            <span class="cart-label">Bag</span>
        </button>
        <div class="added-items" aria-live="polite"></div>
    </div> <!-- middle-header -->
    <div class="bottom-header">
        <nav>
            <ul class="links">
                <li><button class="close" type="button" aria-label="Close menu"><i class="fa-solid fa-xmark"></i></button></li>
                <li><a href="index.html">Home</a></li>
                <li><a href="index.html#products">Shop</a></li>
                <li><a href="index.html#categories">Categories</a>

                    <!-- <ul class="drop">
                    <li><a href="#">mens</a></li>
                    <li><a href="#">womens</a></li>
                    <li><a href="#">kids</a></li>
                </ul></li> -->

                <li><a href="index.html#footer">Contact</a></li>
            </ul>
            <button class="bar" type="button" aria-label="Open menu" aria-expanded="false">
                <i class="fa-solid fa-bars"></i>
            </button>
        </nav> <!-- nav -->
    </div> <!-- bottom-header -->

    <main class="product-page">
        <div class="details-container">

        </div> <!-- card-container -->

    </main> <!-- main -->
    <script src="./product.js"></script>
    <script src="./JS/script.js"></script>
</body>

</html>
